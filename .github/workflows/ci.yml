name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:

# A pull request runs every check: shellcheck, build-health, and `check` (unit tests, Android Lint, detekt, ktlint).
# A push to main, a dispatch or a manual run only builds and runs the unit tests. Branch protection on main
# requires the shellcheck, build-health and build jobs, so their names must stay stable.
jobs:
  # Lints every shell script (*.sh, *.command, .githooks/*) with the runner's preinstalled shellcheck and the
  # repo's .shellcheckrc, the same check .githooks/pre-commit runs on staged files.
  shellcheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' '*.command' '.githooks/*' | xargs -0 --no-run-if-empty shellcheck

  # Dependency advice (unused, undeclared-but-used and wrongly-configured dependencies). Kept out of `check` and the
  # hooks because the advice changes rarely and the analysis is slow, so this separate job is the alarm.
  build-health:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew buildHealth

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check (unit tests, Android Lint, detekt, ktlint) and build
        if: github.event_name == 'pull_request'
        run: ./gradlew check assembleDebug
      - name: Build and run unit tests
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleDebug test

  # Both apps build against portal-commons@main (includeBuild("../portal-commons")), so a green commons run on main
  # re-runs their CI. Never on a pull request: the apps would only rebuild against the unchanged main. APP_DISPATCH_TOKEN: fine-grained PAT, Actions + Contents write on portal-wake and
  # portal-assistant.
  dispatch-apps:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal-wake, portal-assistant]
    steps:
      - env:
          GH_TOKEN: ${{ secrets.APP_DISPATCH_TOKEN }}
        run: >-
          gh api "repos/${{ github.repository_owner }}/${{ matrix.app }}/dispatches"
          -f event_type=portal-commons-green
