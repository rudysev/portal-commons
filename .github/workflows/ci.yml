name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:

jobs:
  # Dependency advice (unused, undeclared-but-used and wrongly-configured dependencies). Kept out of `check` and the
  # hooks because the advice changes rarely and the analysis is slow, so this separate job is the alarm.
  build-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew buildHealth

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test assembleDebug

  # Both apps build against portal-commons@main (includeBuild("../portal-commons")), so a green commons run
  # re-runs their CI. APP_DISPATCH_TOKEN: fine-grained PAT, Actions + Contents write on portal-wake and
  # portal-assistant.
  dispatch-apps:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [portal-wake, portal-assistant]
    steps:
      - env:
          GH_TOKEN: ${{ secrets.APP_DISPATCH_TOKEN }}
        run: >-
          gh api "repos/${{ github.repository_owner }}/${{ matrix.app }}/dispatches"
          -f event_type=portal-commons-green
